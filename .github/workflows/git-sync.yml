name: Auto Create Pull Requests

on:
  push:
    branches:
      - "SW-23-client-changes"
      - "dev"

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request to dev
        if: github.ref_name == 'SW-23-client-changes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Sync: ${{ github.ref_name }} to dev" \
            --body "Automated Sync Pull Request from ${{ github.ref_name }} to dev branch." \
            --base dev \
            --head ${{ github.ref_name }} || echo "PR already exists"

          gh pr merge ${{ github.ref_name }} --merge || echo "Merge failed or already merged"

      - name: Create Pull Request to main
        if: github.ref_name == 'dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Release: dev to main" \
            --body "Automated Pull Request to sync dev changes into main." \
            --base main \
            --head dev || echo "PR already exists"

          gh pr merge dev --merge || echo "Merge failed or already merged"
